<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>My Study Break</title>
</head>

<body id="page">

    <h1 id="title">My Study Break</h1>

    <p>
        Studying for a long time can be tiring.
        This page is a small space for taking a short break.
    </p>

    <img id="studyImage" src="study.jpg" alt="Study break image" width="500">

    <h2>Take a Moment</h2>

    <p id="message">
        Take a short break, relax, and come back when you feel ready.
    </p>

    <button id="moodButton">Change My Mood</button>

    <button id="tipButton">Show a Break Tip</button>

    <button id="surpriseButton">Surprise Me</button>

    <p id="result"></p>

    <script src="script.js"></script>

</body>

</html>
